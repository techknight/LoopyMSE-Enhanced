# LoopyMSE-Enhanced settings.
# Every key can also be given on the command line as --section.key=value,
# which overrides this file. LoopyMSE --help-config lists them all.

[emulator]
bios=bios.bin
sound_bios=soundbios.bin
run_in_background=true
# 1 = real time, 2 = double speed, 0 = as fast as possible
speed=1

[video]
fullscreen=false
scale=4
correct_aspect_ratio=true
crop_overscan=true
antialias=true

[input]
# pad, mouse, or auto (plugs the mouse in for the known mouse games).
# At runtime F1 plugs in the pad and F2 the mouse.
device=auto
# Let a cooperating homebrew cartridge steer the mouse (docs/homebrew-debug-interface.md)
autodrive=false

[keyboard]
up=up
down=down
left=left
right=right
start=return
a=z
b=x
c=c
d=v
l=q
r=w

[controller]
# Valid controller buttons are:
# a b x y back guide start leftstick rightstick leftshoulder rightshoulder dpup dpdown dpleft dpright misc1 paddle1 paddle2 paddle3 paddle4 touchpad
up=dpup
down=dpdown
left=dpleft
right=dpright
start=start
a=a
b=b
c=y
d=x
l=leftshoulder
r=rightshoulder

[sound]
# device or none
output=device

[cart]
sram_write=true
# Save file to use instead of <rom name>.sav beside the ROM
sram=

[paths]
# Folder for everything a run writes; empty = beside the ROM
output=
screenshots=
prints=

[screenshot]
# png, bmp or jpg
image_type=png

[printer]
image_type=png
correct_aspect_ratio=true
view=true
# (OPEN) uses the system's image viewer; otherwise a command where $FILE is the print
view_command=(OPEN)

[debug]
# verbose, trace, debug, info, warn or error
log_level=info
log_file=
log_frames=false
strict=false
